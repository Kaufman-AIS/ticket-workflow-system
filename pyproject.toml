[project]
name = "ticket-workflow-system"
version = "0.1.0"
description = "Paca workflows on Hostinger with Haystack, Cursor, Onyx, Witdem"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
haystack = [
  "haystack-ai>=2.0",
  "witdem-sdk[haystack]>=0.1",
]
dev = [
  "pytest>=8.0",
  "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
