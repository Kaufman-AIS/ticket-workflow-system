openapi: 3.1.0
info:
  title: Paca GPT Action
  version: 1.0.0
  description: >-
    GPT Action bridge for the complete Paca MCP toolset. First call method
    list_tools to discover the available tools and their input schemas. Then
    call any returned tool by using its exact name as method and its arguments
    object as params. This includes reading and writing projects, tasks,
    epics, views, comments, documents, sprints, GitHub links and plugin tools.
servers:
  - url: https://paca.kaufman-ais.com
paths:
  /chatgpt/list_views:
    post:
      operationId: listViews
      summary: List Paca views
      description: List the views for a Paca project. Pass the Paca project ID directly as projectId.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Paca view list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpResult'
        '401':
          description: Invalid bearer token
  /chatgpt/list_tasks:
    post:
      operationId: listTasks
      summary: List Paca tasks
      description: List tasks for a Paca project. Pass the Paca project ID directly as projectId.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListTasksRequest'
      responses:
        '200':
          description: Paca task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpResult'
        '401':
          description: Invalid bearer token
  /chatgpt/rpc:
    post:
      operationId: pacaMcp
      summary: Discover or call a Paca MCP tool
      description: >-
        JSON-RPC-style gateway. Use method list_tools first. For a tool call,
        set method to the exact MCP tool name and params to the tool arguments.
        The bridge forwards the call to the authenticated Paca MCP server.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RpcRequest'
      responses:
        '200':
          description: JSON-RPC result or error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RpcResponse'
        '400':
          description: Invalid JSON-RPC request
        '401':
          description: Invalid bearer token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ProjectRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          description: Paca project ID
        context:
          type: string
        sprintId:
          type: string
      additionalProperties: true
    ListTasksRequest:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          description: Paca project ID
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
        page:
          type: integer
          minimum: 1
      additionalProperties: true
    McpResult:
      type: object
      additionalProperties: true
    RpcRequest:
      type: object
      required: [jsonrpc, id, method]
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
          description: Exact MCP tool name, or list_tools for discovery.
        params:
          type: object
          additionalProperties: true
    RpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
        id:
          oneOf:
            - type: string
            - type: integer
            - type: 'null'
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          additionalProperties: true
